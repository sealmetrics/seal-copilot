name: check

# Everything that needs neither a model nor a Sealmetrics account. This is what
# `scripts/check.sh` exists for, and until now nothing ran it but a person.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # `claude plugin validate` is part of check.sh. Without the CLI the
      # manifest step would fail for the wrong reason, so install it.
      - name: Install the Claude CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Offline gates
        run: bash scripts/check.sh
