name: schema drift

# The linter validates every tool call against a snapshot, so a snapshot that
# goes stale means the linter passes while production breaks. On 2026-09-17 the
# snapshot had 62 tools and the published server announced 64, including two
# the plugin had never heard of.
#
# Weekly, and on demand. It opens an issue rather than failing silently in a
# log nobody reads.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Which tools each transport announces
        id: transports
        run: |
          node evals/dump-transport-tools.mjs > transports.txt 2>&1 || echo "DRIFT" >> $GITHUB_OUTPUT
          cat transports.txt
      - name: MCP schema and event taxonomy
        id: schema
        env:
          SEALMETRICS_API_KEY: ${{ secrets.SEALMETRICS_API_KEY }}
        run: |
          node evals/check-schema-drift.mjs > drift.txt 2>&1 || echo "DRIFT" >> $GITHUB_OUTPUT
          cat drift.txt
      - name: Open an issue when something moved
        if: contains(steps.schema.outputs.DRIFT, 'DRIFT') || contains(steps.transports.outputs.DRIFT, 'DRIFT')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = (f) => { try { return fs.readFileSync(f, 'utf8'); } catch { return '(no output)'; } };
            const body = [
              'The Sealmetrics MCP has moved and the plugin does not know yet.',
              '',
              '## Transports', '```', read('transports.txt').slice(0, 4000), '```',
              '## Schema and taxonomy', '```', read('drift.txt').slice(0, 4000), '```',
              '',
              'Accept with `node evals/dump-transport-tools.mjs --write` and',
              '`node evals/check-schema-drift.mjs --update`, then re-run the linter:',
              'a removed parameter means a skill now writes a call the server rejects,',
              'and a tool that changed transport changes which steps can run at all.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `MCP drift detected (${new Date().toISOString().slice(0, 10)})`,
              body, labels: ['mcp-drift'],
            });
